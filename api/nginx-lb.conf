# Nexora API — nginx load balancer (round-robin, 3 backend instance)
# KAPASİTE HEDEFİ: 20.000 eşzamanlı istek. worker_connections * worker_processes
# nginx tarafındaki eşzamanlı bağlantı tavanını belirler; keepalive upstream'e
# tekrar TCP el sıkışması maliyetini önler (yüksek eşzamanlılıkta kritik).

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # 20K eşzamanlı istek + saha cihazlarından (turnike/QR) sık istek göz
    # önüne alınarak zaman aşımları gevşetildi; keepalive_timeout istemci
    # bağlantısını, upstream keepalive ise backend'e açık tutulan bağlantıyı
    # kapsar — ikisi ayrı, ikisi de eşzamanlılık altında yeniden bağlanma
    # maliyetini düşürür.
    keepalive_timeout  65;
    # Kullanıcı isteği (2026-08-04): vatandaş talep/şikayet formlarına (Muhtarlık modülü)
    # 100MB'a kadar fotoğraf/video eki desteği isteniyor. Kestrel tarafı (appsettings.
    # Production.json Kestrel.MaxRequestBodyBytes=115343360, ~110MB) zaten buna göre
    # ayarlanmıştı, ama bu nginx load balancer 10m limitinde kalmıştı — 10MB üzeri her
    # yükleme API'ye hiç ulaşmadan burada 413 ile reddediliyordu. Aynı 110MB sınırına
    # (multipart overhead payı dahil) çekildi, Kestrel ile tutarlı.
    client_max_body_size 115m;

    log_format main '$remote_addr - $status "$request" $request_time upstream=$upstream_addr uht=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    upstream nexora_api_backend {
        # least_conn: yeni bağlantıyı en az aktif bağlantısı olan instance'a
        # yönlendirir — round-robin'den daha iyi dengeleme sağlar çünkü
        # istekler (ör. rapor/export) süre olarak eşit değildir.
        least_conn;

        # max_fails/fail_timeout gevşetildi: ağır yük altında geçici (birkaç
        # saniyelik) yavaşlama tek bir upstream'i "başarısız" saydırıp TÜM
        # backend'leri aynı anda devre dışı bırakabiliyordu ("no live
        # upstreams"). 5 ardışık başarısızlık + 5s soğuma, gerçek çökmeyi
        # yine hızlıca tespit ederken geçici gecikmeye toleranslıdır.
        server nexora-api-1:34000 max_fails=5 fail_timeout=5s;
        server nexora-api-2:34000 max_fails=5 fail_timeout=5s;
        server nexora-api-3:34000 max_fails=5 fail_timeout=5s;

        # Backend'e açık TCP bağlantı havuzu — her istek için yeniden el
        # sıkışma yapılmasını önler (20K istek/sn senaryosunda kritik).
        keepalive 512;
        keepalive_requests 2000;
        keepalive_timeout 60s;
    }

    # Bulgu (2026-09-20, canlı hata raporu): SignalR hub bağlantıları (/hubs/*) bu
    # load balancer'ın arkasındaki 3 backend instance'a `least_conn` ile SICKY
    # OLMADAN dağıtılıyordu. SignalR'ın negotiate isteği (POST /hubs/team/negotiate)
    # bir bağlantı ID'si üretip HANGİ backend instance'ın bu bağlantıyı bellekte
    # tuttuğunu belirler; hemen ardından gelen asıl transport isteği (WebSocket
    # upgrade / Server-Sent Events / Long Polling — hepsi aynı `?id=<connectionId>`
    # query param'ını taşır) MUTLAKA AYNI instance'a gitmek zorundadır. Redis
    # backplane (AddStackExchangeRedis, Program.cs) yalnızca instance'lar ARASI
    # mesaj yayınını (broadcast) senkronlar — tek bir istemcinin bağlantı
    # yaşam döngüsü boyunca aynı instance'a sabitlenmesi ihtiyacını GİDERMEZ.
    # Sonuç: negotiate başka bir instance'a, transport isteği least_conn ile
    # BAŞKA bir instance'a gidince, o instance "bu ID'de bir bağlantı yok" (404)
    # döndürüyordu — WebSockets/SSE/LongPolling üçü de sırayla aynı nedenle
    # başarısız oluyordu (canlı konsol hatasında görülen tam senaryo).
    # Düzeltme: SignalR bağlantı ID'sine (`$arg_id` — negotiate sonrası TÜM
    # transport isteklerinde bulunan query param) `hash` ile sabitlenen ayrı bir
    # upstream tanımlandı; aynı bağlantı ID'si her zaman aynı backend'e gider.
    # ip_hash KULLANILMADI çünkü NAT/kurumsal proxy arkasındaki çok sayıda
    # kullanıcı aynı IP'yi paylaşabilir, bu da SignalR trafiğini birkaç
    # instance'a haksız yığardı; connection-id hash'i her bağlantı için ayrı
    # ve tekdüze dağılır.
    upstream nexora_api_signalr {
        # SignalR negotiate (POST /hubs/.../negotiate) bağlantı ID'si üretir ve
        # hemen ardından gelen transport isteği (WebSocket/SSE) aynı instance'a
        # gitmelidir. Negotiate anında $arg_id parametresi henüz OLMADIĞINDAN
        # hash $arg_id negotiate ile transport'u farklı sunuculara düşürüyordu.
        # ip_hash istemcinin tüm SignalR isteklerini aynı backend'e sabitler.
        ip_hash;
        server nexora-api-1:34000 max_fails=5 fail_timeout=5s;
        server nexora-api-2:34000 max_fails=5 fail_timeout=5s;
        server nexora-api-3:34000 max_fails=5 fail_timeout=5s;
        keepalive 512;
        keepalive_requests 2000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /health {
            proxy_pass http://nexora_api_backend/health;
            access_log off;
        }

        # SignalR hub'ları (/hubs/team, /hubs/citizen, /hubs/device-monitor,
        # /hubs/mobile-config) — bağlantı ID'sine sabitlenen upstream'e gider.
        # Bu location genel "/" bloğundan ÖNCE eşleşmeli (nginx en uzun/en özel
        # prefix'i seçer, sıralama location bloklarının tanım sırasından
        # bağımsızdır, ama netlik için burada tutuluyor).
        location /hubs/ {
            proxy_pass http://nexora_api_signalr;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket bağlantıları uzun ömürlü açık kalır; okuma zaman aşımı
            # kısa olursa (60s) sunucu hiçbir veri göndermediğinde nginx bağlantıyı
            # sessizce keser, istemci "yeniden bağlan" döngüsüne girer. SignalR
            # kendi keepalive/ping mekanizmasını (varsayılan 15s) kullanır ama
            # nginx read_timeout'u yine de bundan büyük tutulmalı.
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;

            proxy_set_header Upgrade $http_upgrade;
        }

        location / {
            proxy_pass http://nexora_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uzun süren istekler (rapor/export, dosya yükleme) için yeterli
            # zaman aşımı; SignalR websocket upgrade de bu blok üzerinden geçer.
            # send_timeout 60s→180s: 100MB'a kadar video yükleme yavaş mobil
            # bağlantılarda 60 saniyeyi aşabiliyordu, istek yarıda kesilmesin diye.
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 60s;

            # WebSocket (SignalR hub) desteği
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
